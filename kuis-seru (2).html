<script>
(function () {
  /* ===== PENGATURAN ===== */
  var LINK_KUIS = 'https://gwgantenk67.github.io/surat-guru/kuis-seru.html';

  /* Daftar soal. Ubah, tambah, atau hapus sesuka hati.
     q = pertanyaan, a = pilihan jawaban, c = nomor jawaban benar (mulai dari 0), e = penjelasan singkat */
  var SOAL = [
    { q: "Matematika: Hasil dari -5 + 8 adalah...", a: ["-13", "-3", "3", "13"], c: 2, e: "Dari -5 naik 8 langkah, hasilnya 3." },
    { q: "Matematika: Keliling persegi dengan sisi 7 cm adalah...", a: ["14 cm", "28 cm", "49 cm", "21 cm"], c: 1, e: "Keliling persegi = 4 x sisi = 4 x 7 = 28 cm." },
    { q: "Matematika: Luas segitiga dengan alas 10 cm dan tinggi 6 cm adalah...", a: ["16 cm²", "30 cm²", "60 cm²", "36 cm²"], c: 1, e: "Luas segitiga = 1/2 x alas x tinggi = 1/2 x 10 x 6 = 30." },
    { q: "Matematika: Jumlah ketiga sudut dalam sebuah segitiga adalah...", a: ["90°", "180°", "270°", "360°"], c: 1, e: "Jumlah sudut dalam segitiga selalu 180°." },
    { q: "Matematika: Hasil dari 1/2 + 1/4 adalah...", a: ["2/6", "1/6", "3/4", "1/8"], c: 2, e: "1/2 sama dengan 2/4, jadi 2/4 + 1/4 = 3/4." },
    { q: "IPA: Satuan baku (SI) untuk mengukur panjang adalah...", a: ["Kilogram", "Meter", "Detik", "Liter"], c: 1, e: "Satuan SI untuk panjang adalah meter." },
    { q: "IPA: Proses tumbuhan hijau membuat makanan dengan bantuan cahaya matahari disebut...", a: ["Respirasi", "Fotosintesis", "Transpirasi", "Evaporasi"], c: 1, e: "Fotosintesis menghasilkan makanan (glukosa) dan oksigen." },
    { q: "IPA: Perubahan wujud dari padat langsung menjadi gas disebut...", a: ["Mencair", "Membeku", "Menyublim", "Mengembun"], c: 2, e: "Contohnya kapur barus yang lama-lama habis menjadi gas." },
    { q: "IPA: Alat yang digunakan untuk mengukur suhu adalah...", a: ["Barometer", "Termometer", "Stopwatch", "Neraca"], c: 1, e: "Termometer dipakai untuk mengukur suhu." },
    { q: "Bahasa Indonesia: Lawan kata (antonim) dari \"rajin\" adalah...", a: ["Giat", "Tekun", "Malas", "Pandai"], c: 2, e: "Antonim berarti lawan kata. Lawan rajin adalah malas." },
    { q: "Bahasa Inggris: Bentuk jamak (plural) dari \"child\" adalah...", a: ["Childs", "Childes", "Children", "Childrens"], c: 2, e: "\"Child\" adalah kata tak beraturan. Jamaknya \"children\"." },
    { q: "PPKn: Sila pertama Pancasila berbunyi...", a: ["Kemanusiaan yang adil dan beradab", "Persatuan Indonesia", "Ketuhanan Yang Maha Esa", "Keadilan sosial bagi seluruh rakyat Indonesia"], c: 2, e: "Sila pertama: Ketuhanan Yang Maha Esa." },
    { q: "Umum: Apa rumus kimia air?", a: ["CO2", "O2", "H2O", "NaCl"], c: 2, e: "Air terdiri dari 2 atom hidrogen dan 1 atom oksigen." },
    { q: "Umum: Benua yang paling luas adalah...", a: ["Afrika", "Eropa", "Australia", "Asia"], c: 3, e: "Asia adalah benua terluas dan paling banyak penduduknya." },
    { q: "Umum: Hewan terbesar di dunia adalah...", a: ["Gajah", "Paus biru", "Jerapah", "Hiu putih"], c: 1, e: "Paus biru bisa sepanjang sekitar 30 meter." },
    { q: "Umum: Indonesia memproklamasikan kemerdekaan pada tahun...", a: ["1942", "1945", "1950", "1955"], c: 1, e: "Proklamasi dibacakan pada 17 Agustus 1945." },
    { q: "Umum: Planet yang paling dekat dengan Matahari adalah...", a: ["Venus", "Bumi", "Merkurius", "Mars"], c: 2, e: "Merkurius adalah planet terdekat dari Matahari." },
    { q: "Umum: Hewan yang makanannya hanya tumbuhan disebut...", a: ["Karnivora", "Herbivora", "Omnivora", "Insektivora"], c: 1, e: "Herbivora memakan tumbuhan, contohnya sapi dan kambing." },
    { q: "Umum: Arti semboyan \"Bhinneka Tunggal Ika\" adalah...", a: ["Bersatu kita teguh", "Berbeda-beda tetapi tetap satu", "Tanah air kita", "Maju terus pantang mundur"], c: 1, e: "Berbeda-beda tetapi tetap satu jua." },
    { q: "Umum: Gas yang kita hirup untuk bernapas adalah...", a: ["Karbon dioksida", "Nitrogen", "Hidrogen", "Oksigen"], c: 3, e: "Tubuh memakai oksigen untuk menghasilkan tenaga." }
  ];

  var HURUF = ['A', 'B', 'C', 'D'];
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Nama kelas dari link, contoh ...kuis-seru.html?kelas=7H */
  $('jumlah').textContent = SOAL.length;
  var kelas = '';
  try { kelas = (new URLSearchParams(location.search).get('kelas') || '').slice(0, 20); } catch (e) {}
  if (kelas) { $('kelasBadge').textContent = 'Kelas ' + kelas; $('kelasBadge').hidden = false; }

  /* ===== Suara ===== */
  var ctx = null, master = null, musicGain = null, soundOn = true;
  function audio() {
    if (ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = soundOn ? 0.7 : 0; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);
    return true;
  }
  function tone(f, t, d, type, v) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.25, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
  }
  function play(kind) {
    if (!soundOn || !audio()) return;
    ctx.resume();
    var t = ctx.currentTime + 0.02;
    if (kind === 'ok') { tone(659, t, .18, 'triangle'); tone(880, t + .12, .3, 'triangle'); }
    else if (kind === 'no') { tone(220, t, .25, 'sawtooth', .15); tone(165, t + .16, .35, 'sawtooth', .15); }
    else if (kind === 'click') { tone(520, t, .08, 'square', .08); }
    else if (kind === 'win') { [523, 659, 784, 1046, 784, 1046].forEach(function (f, i) { tone(f, t + i * .13, .35, 'triangle', .22); }); }
    else if (kind === 'meh') { [392, 330, 262].forEach(function (f, i) { tone(f, t + i * .2, .4, 'triangle', .2); }); }
  }

  /* ===== Musik latar santai (dibuat sendiri dengan Web Audio) ===== */
  var BPM = 76, beat = 60 / BPM, stepDur = beat / 2;
  var CHORDS = [
    [261.63, 329.63, 392.00, 493.88],   /* Cmaj7 */
    [220.00, 261.63, 329.63, 392.00],   /* Am7 */
    [293.66, 349.23, 440.00, 523.25],   /* Dm7 */
    [196.00, 246.94, 293.66, 349.23]    /* G7 */
  ];
  var BASS = [130.81, 110.00, 146.83, 98.00];
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.00];
  var musicTimer = null, musicNext = 0, musicStep = 0, noiseBuf = null, fileAudio = null, useFile = false;

  function chordPad(freqs, t, dur) {
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.connect(musicGain);
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.25);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function bassNote(f, t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + beat * 1.8);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + beat * 1.9);
  }
  function hat(t) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(hp); hp.connect(g); g.connect(musicGain); src.start(t, 0, 0.08);
  }
  function melody(f, t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 1.15);
  }
  function musicTick() {
    if (!ctx || !soundOn) return;
    while (musicNext < ctx.currentTime + 0.4) {
      var inBar = musicStep % 8, bar = Math.floor(musicStep / 8) % 4;
      if (inBar === 0) { chordPad(CHORDS[bar], musicNext, stepDur * 8); bassNote(BASS[bar], musicNext); }
      if (inBar === 4) bassNote(BASS[bar], musicNext);
      if (inBar % 2 === 1) hat(musicNext);
      if (inBar !== 0 && Math.random() < 0.28) melody(PENTA[Math.floor(Math.random() * PENTA.length)], musicNext);
      musicNext += stepDur; musicStep++;
    }
  }
  function synthMusic() {
    if (musicTimer || !ctx) return;
    musicNext = ctx.currentTime + 0.1;
    musicTimer = setInterval(musicTick, 150);
  }
  /* Kalau ada file musik.mp3 di folder yang sama, file itu yang diputar. Kalau tidak ada, pakai musik buatan di atas. */
  function startMusic() {
    if (!audio()) return;
    ctx.resume();
    if (useFile && fileAudio) { fileAudio.muted = !soundOn; fileAudio.play().catch(function () {}); return; }
    if (fileAudio === null) {
      try {
        fileAudio = new Audio('musik.mp3'); fileAudio.loop = true; fileAudio.volume = 0.5;
        fileAudio.addEventListener('error', function () { useFile = false; synthMusic(); });
        var pr = fileAudio.play();
        if (pr && pr.then) pr.then(function () { useFile = true; }, function () { useFile = false; synthMusic(); });
        else synthMusic();
      } catch (e) { fileAudio = false; synthMusic(); }
      return;
    }
    synthMusic();
  }

  $('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔔 Suara: nyala' : '🔇 Suara: mati';
    this.setAttribute('aria-pressed', String(soundOn));
    if (ctx) master.gain.value = soundOn ? 0.7 : 0;
    if (fileAudio) fileAudio.muted = !soundOn;
    if (soundOn && ctx && !musicTimer && !useFile && fileAudio !== null) synthMusic();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (ctx) ctx.suspend(); if (fileAudio && useFile) fileAudio.pause(); }
    else { if (ctx && soundOn) ctx.resume(); if (fileAudio && useFile && soundOn) fileAudio.play().catch(function () {}); }
  });

  /* ===== Permainan ===== */
  var urutan = [], idx = 0, skor = 0, terjawab = false;

  function acak(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function tampil(id) { ['start', 'play', 'end'].forEach(function (s) { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  function mulai() {
    urutan = acak(SOAL.map(function (_, i) { return i; }));
    idx = 0; skor = 0;
    tampil('play'); soal();
  }

  function soal() {
    terjawab = false;
    var s = SOAL[urutan[idx]];
    $('no').textContent = 'Soal ' + (idx + 1) + ' / ' + SOAL.length;
    $('pts').textContent = 'Skor ' + skor;
    $('fill').style.width = (idx / SOAL.length * 100) + '%';
    $('q').textContent = s.q;
    $('note').hidden = true; $('nextBtn').hidden = true;
    var box = $('opts'); box.innerHTML = '';
    var pilihan = acak(s.a.map(function (t, i) { return { t: t, benar: i === s.c }; }));
    pilihan.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      b.innerHTML = '<span class="l">' + HURUF[i] + '</span><span></span>';
      b.lastChild.textContent = p.t;
      b.addEventListener('click', function () { jawab(b, p.benar, s); });
      b.dataset.benar = p.benar ? '1' : '0';
      box.appendChild(b);
    });
  }

  function jawab(btn, benar, s) {
    if (terjawab) return;
    terjawab = true;
    var semua = $('opts').querySelectorAll('.opt');
    for (var i = 0; i < semua.length; i++) {
      semua[i].disabled = true;
      if (semua[i].dataset.benar === '1') semua[i].classList.add('ok');
    }
    if (benar) { skor++; play('ok'); } else { btn.classList.add('no'); play('no'); }
    $('pts').textContent = 'Skor ' + skor;
    $('note').textContent = (benar ? 'Benar! ' : 'Kurang tepat. ') + s.e;
    $('note').hidden = false;
    $('nextBtn').textContent = idx === SOAL.length - 1 ? 'Lihat hasil' : 'Lanjut';
    $('nextBtn').hidden = false;
    $('nextBtn').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  }

  function hasil() {
    $('fill').style.width = '100%';
    var n = SOAL.length, p = skor / n, judul, sub;
    if (p === 1) { judul = 'Sempurna! Juara Kelas 🏆'; sub = 'Semua jawabanmu benar. Hebat sekali!'; }
    else if (p >= 0.8) { judul = 'Keren, Hampir Sempurna!'; sub = 'Tinggal sedikit lagi menuju nilai penuh.'; }
    else if (p >= 0.6) { judul = 'Lumayan Pintar!'; sub = 'Coba lagi, siapa tahu skormu naik.'; }
    else if (p >= 0.4) { judul = 'Ayo Belajar Lagi!'; sub = 'Masih ada waktu untuk mengejar teman-temanmu.'; }
    else { judul = 'Perlu Remedial 😄'; sub = 'Tenang, namanya juga belajar. Coba sekali lagi!'; }
    $('score').innerHTML = skor + '<small> / ' + n + '</small>';
    $('rank').textContent = judul; $('rankSub').textContent = sub;
    var st = ''; for (var i = 0; i < 5; i++) st += i < Math.round(p * 5) ? '⭐' : '☆';
    $('stars').textContent = st;
    teks = 'Skorku di Kuis Seru' + (kelas ? ' (Kelas ' + kelas + ')' : '') + ': ' + skor + '/' + n + ' - ' + judul.replace(/[^\w\s!,.\/-]/g, '').trim() + '. Coba kamu bisa berapa? ' + LINK_KUIS + (kelas ? '?kelas=' + encodeURIComponent(kelas) : '');
    $('shareBtn').href = 'https://wa.me/?text=' + encodeURIComponent(teks);
    tampil('end');
    if (p >= 0.6) { play('win'); confetti(); } else { play('meh'); }
  }
  var teks = '';

  function confetti() {
    if (reduce) return;
    var set = ['🎉', '⭐', '✨', '🎊', '💛'];
    for (var i = 0; i < 24; i++) {
      (function (i) {
        setTimeout(function () {
          var c = document.createElement('div');
          c.className = 'confetti'; c.textContent = set[i % set.length];
          c.style.left = (Math.random() * 94) + '%';
          c.style.animationDuration = (3 + Math.random() * 3) + 's';
          document.body.appendChild(c);
          setTimeout(function () { c.remove(); }, 6500);
        }, i * 90);
      })(i);
    }
  }

  $('startBtn').addEventListener('click', function () { audio(); play('click'); startMusic(); mulai(); });
  $('nextBtn').addEventListener('click', function () {
    play('click');
    if (idx === SOAL.length - 1) hasil(); else { idx++; soal(); }
  });
  $('againBtn').addEventListener('click', function () { play('click'); mulai(); });

  /* Bagikan: coba buka aplikasi WhatsApp langsung, cadangan ke versi web */
  $('shareBtn').addEventListener('click', function (e) {
    e.preventDefault();
    var web = this.href, left = false;
    var mark = function () { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', mark);
    window.location.href = 'whatsapp://send?text=' + encodeURIComponent(teks);
    setTimeout(function () {
      document.removeEventListener('visibilitychange', mark);
      if (!left && !document.hidden) window.location.href = web;
    }, 1800);
  });
})();
</script>
</body>
</html>
